allowBuilds:
  esbuild: true

# pnpm v11 supply-chain hardening (these are defaults, made explicit for visibility)
strictDepBuilds: true      # error if unlisted package tries to run a build script
minimumReleaseAge: 1440    # ignore packages published less than 24h ago
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.8'
  - '@biomejs/cli-darwin-arm64@2.5.8'
  - '@biomejs/cli-darwin-x64@2.5.8'
  - '@biomejs/cli-linux-arm64-musl@2.5.8'
  - '@biomejs/cli-linux-arm64@2.5.8'
  - '@biomejs/cli-linux-x64-musl@2.5.8'
  - '@biomejs/cli-linux-x64@2.5.8'
  - '@biomejs/cli-win32-arm64@2.5.8'
  - '@biomejs/cli-win32-x64@2.5.8'
