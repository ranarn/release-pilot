allowBuilds:
  esbuild: true

# pnpm v11 supply-chain hardening (these are defaults, made explicit for visibility)
strictDepBuilds: true      # error if unlisted package tries to run a build script
minimumReleaseAge: 1440    # ignore packages published less than 24h ago

# Pin the store dir name length (Windows default is 60, Linux 120) so dist/main.js
# built locally on Windows is byte-identical to the one CI builds on Linux.
virtualStoreDirMaxLength: 60
